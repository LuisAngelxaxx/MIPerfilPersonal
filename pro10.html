
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 10 | Viaje</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    padding:50px 20px;
}

.viaje{
    max-width:900px;
    margin:auto;
}

.etiqueta{
    color:#888;
    letter-spacing:4px;
    font-size:12px;
}

h1{
    font-size:65px;
    line-height:.9;
    margin:20px 0 50px;
}

.destino{
    background:white;
    color:#111;
    padding:25px;
    margin-bottom:15px;
}

.destino strong{
    font-size:25px;
}

.gastos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.gasto{
    border:1px solid #333;
    padding:25px;
}

.gasto small{
    color:#888;
}

.gasto strong{
    display:block;
    font-size:28px;
    margin-top:15px;
}

.total{
    margin-top:15px;
    background:#333;
    padding:30px;
}

.total strong{
    display:block;
    font-size:45px;
    margin-top:10px;
}

a{
    display:block;
    margin-top:25px;
    color:white;
    text-decoration:none;
}

@media(max-width:650px){
    .gastos{grid-template-columns:1fr}
    h1{font-size:48px}
}
</style>
</head>

<body>

<div class="viaje">

    <div class="etiqueta">
        WEB ENIGMA / RETO 10 / TRAVEL
    </div>

    <h1>
        Presupuesto<br>
        de viaje
    </h1>

    <div class="destino">
        DURACIÓN DEL VIAJE:
        <strong id="dias"></strong>
    </div>

    <div class="gastos">

        <div class="gasto">
            <small>ALIMENTACIÓN</small>
            <strong id="alimentacion"></strong>
        </div>

        <div class="gasto">
            <small>TRANSPORTE</small>
            <strong id="transporte"></strong>
        </div>

        <div class="gasto">
            <small>ALOJAMIENTO</small>
            <strong id="alojamiento"></strong>
        </div>

    </div>

    <div class="total">
        PRESUPUESTO TOTAL
        <strong id="total"></strong>
    </div>

    <a href="index.html">← VOLVER A WEB ENIGMA</a>

</div>

<script>
let dias=parseInt(prompt("Ingrese la cantidad de días:"));
let alimentacion=parseFloat(prompt("Ingrese el gasto diario en alimentación:"));
let transporte=parseFloat(prompt("Ingrese el gasto diario en transporte:"));
let alojamiento=parseFloat(prompt("Ingrese el gasto diario en alojamiento:"));

let totalAlimentacion=alimentacion*dias;
let totalTransporte=transporte*dias;
let totalAlojamiento=alojamiento*dias;

let presupuestoTotal=
    totalAlimentacion+
    totalTransporte+
    totalAlojamiento;

document.getElementById("dias").textContent=dias+" días";
document.getElementById("alimentacion").textContent="S/ "+totalAlimentacion.toFixed(2);
document.getElementById("transporte").textContent="S/ "+totalTransporte.toFixed(2);
document.getElementById("alojamiento").textContent="S/ "+totalAlojamiento.toFixed(2);
document.getElementById("total").textContent="S/ "+presupuestoTotal.toFixed(2);
</script>

</body>
</html>
