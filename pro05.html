
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 05 | Descuento</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#111;
    min-height:100vh;
}

.contenedor{
    max-width:900px;
    margin:70px auto;
    padding:20px;
}

.etiqueta{
    display:inline-block;
    background:#111;
    color:white;
    padding:8px 14px;
    font-size:12px;
    letter-spacing:2px;
}

h1{
    font-size:55px;
    margin:25px 0 50px;
}

.precio{
    font-size:70px;
    font-weight:900;
    border-bottom:5px solid #111;
    padding-bottom:20px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:30px;
}

.info div{
    padding:25px;
    border:1px solid #ccc;
}

.info strong{
    display:block;
    font-size:28px;
    margin-top:10px;
}

.final{
    margin-top:20px;
    padding:30px;
    background:#111;
    color:white;
}

.final strong{
    font-size:40px;
}

a{
    display:block;
    margin-top:25px;
    color:#111;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:600px){
    h1{font-size:40px}
    .precio{font-size:50px}
    .info{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="contenedor">

    <span class="etiqueta">RETO 05 / STORE</span>

    <h1>Descuento en una tienda</h1>

    <div class="precio" id="precio"></div>

    <div class="info">

        <div>
            DESCUENTO 15%
            <strong id="descuento"></strong>
        </div>

        <div>
            PRECIO FINAL
            <strong id="final"></strong>
        </div>

    </div>

    <a href="index.html">← VOLVER</a>

</div>

<script>
let precio=parseFloat(prompt("Ingrese el precio del producto:"));

let descuento=precio*0.15;
let precioFinal=precio-descuento;

document.getElementById("precio").textContent="S/ "+precio.toFixed(2);
document.getElementById("descuento").textContent="S/ "+descuento.toFixed(2);
document.getElementById("final").textContent="S/ "+precioFinal.toFixed(2);
</script>

</body>
</html>
