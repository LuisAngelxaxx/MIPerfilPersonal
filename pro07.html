
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 07 | Sueldo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    padding:40px 20px;
}

.nomina{
    max-width:750px;
    margin:auto;
}

.codigo{
    color:#888;
    letter-spacing:3px;
    font-size:12px;
}

h1{
    font-size:50px;
    margin:15px 0 40px;
}

.sueldo{
    background:white;
    color:#111;
    padding:35px;
    margin-bottom:15px;
}

.sueldo span{
    color:#777;
}

.sueldo strong{
    display:block;
    font-size:45px;
    margin-top:10px;
}

.datos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.dato{
    border:1px solid #333;
    padding:25px;
}

.dato strong{
    display:block;
    font-size:25px;
    margin-top:10px;
}

.final{
    margin-top:15px;
    background:#333;
    padding:30px;
}

.final strong{
    display:block;
    font-size:42px;
    margin-top:10px;
}

a{
    display:block;
    color:white;
    text-decoration:none;
    margin-top:25px;
}

@media(max-width:600px){
    .datos{grid-template-columns:1fr}
    h1{font-size:40px}
}
</style>
</head>

<body>

<div class="nomina">

    <div class="codigo">WEB ENIGMA / RETO 07 / PAYROLL</div>

    <h1>Sueldo de trabajador</h1>

    <div class="sueldo">
        <span>SUELDO BRUTO</span>
        <strong id="bruto"></strong>
    </div>

    <div class="datos">

        <div class="dato">
            DESCUENTO
            <strong id="descuento"></strong>
        </div>

        <div class="dato">
            PORCENTAJE
            <strong>13%</strong>
        </div>

    </div>

    <div class="final">
        SUELDO FINAL
        <strong id="final"></strong>
    </div>

    <a href="index.html">← VOLVER A WEB ENIGMA</a>

</div>

<script>
let sueldoBruto=parseFloat(prompt("Ingrese el sueldo mensual:"));

let descuento=sueldoBruto*0.13;
let sueldoFinal=sueldoBruto-descuento;

document.getElementById("bruto").textContent="S/ "+sueldoBruto.toFixed(2);
document.getElementById("descuento").textContent="S/ "+descuento.toFixed(2);
document.getElementById("final").textContent="S/ "+sueldoFinal.toFixed(2);
</script>

</body>
</html>
