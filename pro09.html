
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 09 | Moneda</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:white;
    color:#111;
    min-height:100vh;
}

.finanzas{
    max-width:900px;
    margin:80px auto;
    padding:20px;
}

.codigo{
    font-size:12px;
    color:#777;
    letter-spacing:3px;
}

h1{
    font-size:60px;
    margin:15px 0 50px;
}

.conversion{
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
}

.moneda{
    border:2px solid #111;
    padding:35px;
}

.moneda small{
    color:#777;
}

.moneda strong{
    display:block;
    font-size:40px;
    margin-top:15px;
}

.flecha{
    text-align:center;
    font-size:30px;
}

.tipo{
    margin-top:20px;
    padding:20px;
    background:#111;
    color:white;
}

a{
    display:block;
    margin-top:25px;
    color:#111;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:600px){
    .conversion{grid-template-columns:1fr}
    .flecha{padding:15px}
    h1{font-size:42px}
}
</style>
</head>

<body>

<div class="finanzas">

    <div class="codigo">WEB ENIGMA / RETO 09 / FINANCE</div>

    <h1>Conversión monetaria</h1>

    <div class="conversion">

        <div class="moneda">
            <small>SOLES</small>
            <strong id="soles"></strong>
        </div>

        <div class="flecha">→</div>

        <div class="moneda">
            <small>DÓLARES</small>
            <strong id="dolares"></strong>
        </div>

    </div>

    <div class="tipo">
        TIPO DE CAMBIO:
        <strong id="cambio"></strong>
    </div>

    <a href="index.html">← VOLVER A WEB ENIGMA</a>

</div>

<script>
let soles=parseFloat(prompt("Ingrese el monto en soles:"));
let tipoCambio=parseFloat(prompt("Ingrese el tipo de cambio:"));

let dolares=soles/tipoCambio;

document.getElementById("soles").textContent="S/ "+soles.toFixed(2);
document.getElementById("dolares").textContent="US$ "+dolares.toFixed(2);
document.getElementById("cambio").textContent=tipoCambio.toFixed(2);
</script>

</body>
</html>
