
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto 02 | Útiles</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#111;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#fff;
    width:90%;
    max-width:600px;
    padding:45px;
    border-radius:25px;
}

.numero{
    font-size:70px;
    font-weight:900;
    color:#ddd;
}

h1{
    font-size:35px;
    margin-bottom:30px;
}

.producto{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0;
}

.producto div{
    border:1px solid #ddd;
    padding:18px;
}

.total{
    margin-top:25px;
    padding:20px;
    background:#111;
    color:white;
    text-align:center;
    font-size:22px;
}

a{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#111;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

    <div class="numero">02</div>

    <h1>Compra de útiles escolares</h1>

    <div class="producto">
        <div>Cuadernos</div>
        <div id="cuadernos"></div>
    </div>

    <div class="producto">
        <div>Lapiceros</div>
        <div id="lapiceros"></div>
    </div>

    <div class="total" id="resultado"></div>

    <a href="index.html">← VOLVER A WEB ENIGMA</a>

</div>

<script>
let precioCuaderno=parseFloat(prompt("Ingrese el precio del cuaderno:"));
let cantidadCuadernos=parseInt(prompt("Ingrese la cantidad de cuadernos:"));
let precioLapicero=parseFloat(prompt("Ingrese el precio del lapicero:"));
let cantidadLapiceros=parseInt(prompt("Ingrese la cantidad de lapiceros:"));

let totalCuadernos=precioCuaderno*cantidadCuadernos;
let totalLapiceros=precioLapicero*cantidadLapiceros;
let total=totalCuadernos+totalLapiceros;

document.getElementById("cuadernos").textContent="S/ "+totalCuadernos.toFixed(2);
document.getElementById("lapiceros").textContent="S/ "+totalLapiceros.toFixed(2);
document.getElementById("resultado").textContent="TOTAL: S/ "+total.toFixed(2);
</script>

</body>
</html>
